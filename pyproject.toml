[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-challenge"
version = "0.1.0"
description = "A local pageview streaming exercise"
requires-python = ">=3.11"
dependencies = ["confluent-kafka==2.16.1"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration' --strict-markers"
markers = ["integration: requires local Docker services", "flink: also requires the Flink cluster on 127.0.0.1:8081"]
