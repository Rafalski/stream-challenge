name: stream-challenge

services:
  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: "q7m4G3bHTx2wV9nL8c6PQA"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,HOST://127.0.0.1:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
          --create --if-not-exists --topic pageviews --partitions 1 --replication-factor 1 \
          --config retention.ms=86400000 --config retention.bytes=268435456 \
          --config segment.bytes=16777216 --config segment.ms=3600000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
          --describe --topic pageviews

  raw-ingester:
    build: .
    image: stream-challenge-python:local
    profiles: ["app"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_FORMAT: "${LOG_FORMAT:-console}"
      LOG_COLOUR: "${LOG_COLOUR:-always}"
    volumes:
      - ./data:/app/data
    entrypoint: ["python", "-m", "stream_challenge.ingest"]
    stop_grace_period: 15s

  producer:
    build: .
    image: stream-challenge-python:local
    profiles: ["tools"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_FORMAT: "${LOG_FORMAT:-console}"
      LOG_COLOUR: "${LOG_COLOUR:-always}"
    entrypoint: ["python", "-m", "stream_challenge.producer"]

  jobmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    image: stream-challenge-flink:local
    profiles: ["flink"]
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./flink-config.yaml:/usr/local/lib/python3.11/site-packages/pyflink/conf/config.yaml:ro
      - ./data:/app/data
    command: ["jobmanager.sh", "start-foreground"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/overview"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  taskmanager:
    image: stream-challenge-flink:local
    profiles: ["flink"]
    depends_on:
      jobmanager:
        condition: service_healthy
    environment:
      LOG_FORMAT: "${LOG_FORMAT:-console}"
      LOG_COLOUR: "${LOG_COLOUR:-always}"
    volumes:
      - ./flink-config.yaml:/usr/local/lib/python3.11/site-packages/pyflink/conf/config.yaml:ro
      - ./data:/app/data
    command: ["taskmanager.sh", "start-foreground"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://jobmanager:8081/overview', timeout=3))['taskmanagers'] == 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  aggregation:
    image: stream-challenge-flink:local
    profiles: ["flink"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_FORMAT: "${LOG_FORMAT:-console}"
      LOG_COLOUR: "${LOG_COLOUR:-always}"
    volumes:
      - ./flink-config.yaml:/usr/local/lib/python3.11/site-packages/pyflink/conf/config.yaml:ro
      - ./data:/app/data
    entrypoint: ["flink", "run", "--jobmanager", "jobmanager:8081", "--python", "/app/src/stream_challenge/aggregation.py"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka-smoke-test:
    image: apache/kafka:4.3.2
    profiles: ["test"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./tests/integration/kafka-smoke-test.sh:/tests/kafka-smoke-test.sh:ro
    entrypoint: ["/bin/sh", "/tests/kafka-smoke-test.sh"]

volumes:
  kafka-data:
